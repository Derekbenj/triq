[package]
name = "triq-snarl"
description = "Node graphs for egui, as triq's workbench draws its graph: egui-snarl, ported to egui 0.37, with changes"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["egui", "node", "graph", "ui", "node-graph"]
categories = ["gui", "visualization"]

[features]
serde = ["dep:serde", "egui/serde", "slab/serde"]

[dependencies]
ahash = { version = "0.8.12", default-features = false }
egui = "=0.37.0"
slab = "0.4"
serde = { workspace = true, optional = true }
smallvec = { version = "1.15", features = ["const_new"] }
