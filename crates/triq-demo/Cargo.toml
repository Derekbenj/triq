[package]
name = "triq-demo"
description = "The workbench with a project's own viewers in the same window"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
triq = { path = "../triq" }
triq-workbench = { path = "../triq-workbench" }
# Only the viewers and the messages they draw: neither SDL nor Bevy is built for this.
triq-xbox = { path = "../triq-xbox", default-features = false, features = ["viewer"] }
triq-bevy = { path = "../triq-bevy", default-features = false, features = ["viewer"] }

[dev-dependencies]
egui_kittest.workspace = true
serde_json.workspace = true
