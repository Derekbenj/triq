[package]
name = "triq-bevy"
description = "A Bevy scene whose rig and cameras are triq nodes"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["engine", "viewer"]
# The Bevy program itself. Leave it off to use only the messages and the rig's motion.
engine = ["dep:bevy"]
# A node that draws camera frames, for programs drawn with egui.
viewer = ["dep:egui"]

[dependencies]
triq = { path = "../triq" }
triq-xbox = { path = "../triq-xbox", default-features = false }
serde.workspace = true
serde_json.workspace = true
bevy = { version = "=0.20.1", optional = true }
egui = { workspace = true, optional = true }

[dev-dependencies]
# A program with a window brings its own fonts; the tests need some too.
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[[bin]]
name = "triq-bevy"
required-features = ["engine"]

[[test]]
name = "pipeline"
required-features = ["engine"]

[[test]]
name = "viewer"
required-features = ["viewer"]
