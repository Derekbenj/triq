[package]
name = "triq-workbench"
description = "See the runtimes on this machine as a graph, and rewire them"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
triq.workspace = true
# Reads topics as bytes, for the numbers inside messages whose type the workbench was not built with.
triq-tap.workspace = true
# With what it takes to keep the window and its arrangement from one run to the next.
eframe = { version = "=0.37.0", features = ["persistence"] }
# The graph: egui-snarl, ported to egui 0.37, with the wire and click behaviour it relies on.
triq-snarl.workspace = true
# Lays the windows and the charts out as panes, which are resized and dragged about.
egui_tiles = { version = "=0.18.0", default-features = false, features = ["serde"] }
# The rules that panes are arranged by, shared with the windows that projects make for their views.
triq-views.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# For a test that publishes a topic without triq.
iceoryx2.workspace = true
egui_kittest.workspace = true
