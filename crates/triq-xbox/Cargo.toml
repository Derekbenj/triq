[package]
name = "triq-xbox"
description = "Xbox-style controllers as triq nodes"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["sdl", "viewer"]
# Reading physical controllers. Leave it off to use only the message type.
sdl = ["dep:sdl3"]
# A node that draws a controller's state, for programs drawn with egui.
viewer = ["dep:egui"]

[dependencies]
triq = { path = "../triq" }
serde.workspace = true
serde_json.workspace = true
# Built from source and linked statically, so no SDL3 library needs to be installed.
sdl3 = { version = "=0.20.0", optional = true, default-features = false, features = ["build-from-source-static"] }

egui = { workspace = true, optional = true }

[dev-dependencies]
# A program with a window brings its own fonts; the tests need some too.
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest.workspace = true

[[bin]]
name = "triq-xbox"
required-features = ["sdl"]

[[test]]
name = "viewer"
required-features = ["viewer"]
