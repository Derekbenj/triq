[package]
name = "triq-xbox"
description = "Xbox-style controllers as triq nodes"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["sdl"]
# Reading physical controllers. Leave it off to use only the message type.
sdl = ["dep:sdl3"]

[dependencies]
triq = { path = "../triq" }
serde.workspace = true
serde_json.workspace = true
# Built from source and linked statically, so no SDL3 library needs to be installed.
sdl3 = { version = "=0.20.0", optional = true, default-features = false, features = ["build-from-source-static"] }

[[bin]]
name = "triq-xbox"
required-features = ["sdl"]
