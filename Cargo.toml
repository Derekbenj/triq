[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Derekbenj/triq"
readme = "README.md"

[workspace.dependencies]
# Built here, and by whoever depends on triq by its git address, on a fork of iceoryx2 0.10.0
# that carries fixes for macOS. A crate on crates.io may only name crates that are there, so
# the published triq names the release; see "Platforms" in the README.
iceoryx2 = { version = "0.10.0", git = "https://github.com/Derekbenj/iceoryx2.git", rev = "638d936394bc5ceff3462c23dbcb4b7c220a040e" }
serde = { version = "1", features = ["derive"] }
# A node's settings are shown as text and sent back as text. Read exactly, a number comes back
# the number it was; without this, some come back one step of rounding away.
serde_json = { version = "1", features = ["float_roundtrip"] }
# The crates of this repository: built from the path here, asked for by version on crates.io.
triq = { path = "crates/triq", version = "0.2.0" }
triq-macros = { path = "crates/triq-macros", version = "0.2.0" }
triq-tap = { path = "crates/triq-tap", version = "0.2.0" }
triq-snarl = { path = "crates/triq-snarl", version = "0.2.0" }
triq-views = { path = "crates/triq-views", version = "0.2.0", default-features = false }
# Drives the workbench's window code in its tests, without opening a window.
egui_kittest = { version = "=0.37.0", features = ["wgpu", "snapshot"] }
