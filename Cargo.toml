[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The patched fork carries the macOS file-descriptor and kqueue fixes.
iceoryx2 = { git = "https://github.com/Derekbenj/iceoryx2.git", rev = "638d936394bc5ceff3462c23dbcb4b7c220a040e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
triq-macros = { path = "crates/triq-macros" }
